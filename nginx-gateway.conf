# Sample NGINX API Gateway configuration for the News Platform

upstream user_service {
    server user-service:3001;
    keepalive 32;
}
upstream article_service {
    server article-service:3002;
    keepalive 32;
}
upstream feed_service {
    server feed-service:3003;
    keepalive 32;
}
upstream notification_service {
    server notification-service:3004;
    keepalive 32;
}
upstream trending_service {
    server trending-service:3005;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

server {
    listen 80;
    server_name api.newsplatform.com;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /api/users/ {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://user_service/;
    }

    location /api/articles/ {
        proxy_pass http://article_service/;
    }

    location /api/feed {
        proxy_pass http://feed_service/;
    }

    location /api/notifications/ {
        proxy_pass http://notification_service/;
    }

    location /api/trending {
        proxy_pass http://trending_service/;
    }

    location / {
        return 404 '{"error":"Not found"}';
        add_header Content-Type application/json;
    }
}
